name: GitHub Metrics

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch: {}

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            location: metrics
            name: metrics.svg
            style: Tokyo-night
          base: ""
          config: |
            {
              "sections": {
                "header": {
                  "title": "Himanshu Gupta",
                  "subtitle": "Full-Stack + Data-Driven Developer",
                  "text_color": "38bdf8"
                },
                "activity": {
                  "掐show": true,
                  "patterns": ["#38bdf8"]
                },
                "answered_reviews": false,
                "code-review": false,
                "debug": false,
                "deepsource": false,
                "github_repository": false,
                "lines_of_code": {
                  "show": true
                },
                "languages": {
                  "show": true,
                  "limit": 8,
                  "colors": {
                    "javascript": "#f7df1e",
                    "python": "#3572A5",
                    "java": "#b07219",
                    "html": "#e34c26",
                    "css": "#563d7c",
                    "react": "#61DAFB"
                  }
                },
                "licenses": {
                  "show": true
                },
                "location": {
                  "show": true
                },
                "metadata": {
                  "show": true
                },
                "npm_total_downloads": false,
                "obfuscation": false,
                "projects": {
                  "show": true
                },
                "pull_requests": {
                  "show": true
                },
                "pull_requests_creatives": {
                  "show": true
                },
                "pull_requests_reviews": {
                  "show": true
                },
                "pull_requests_spacing": {
                  "show": true
                },
                "repositories": {
                  "show": true,
                  "stars": true,
                  "forks": true,
                  "best": true
                },
                "stargazers": {
                  "show": true
                },
                "topics": {
                  "show": true
                },
                "traffic": {
                  "show": true
                }
              }
            }

      - name: Upload metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: GitHub Metrics
          path: metrics/

      - name: Commit metrics
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add metrics/
          git diff --staged --quiet || git commit -m "Update GitHub metrics [skip ci]"
          git push
